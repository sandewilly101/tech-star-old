services:
  - type: web
    name: techstar-innovation-hub
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      # Single-page app: every unmatched path is served by index.html so that
      # deep links such as /programs/kids-stem-iot-robotics-bootcamps work.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
